<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" fill="none">
  <defs>
    <linearGradient id="dawnSky" x1="500" y1="0" x2="500" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1930" />
      <stop offset="36%" stop-color="#15315C" />
      <stop offset="68%" stop-color="#2B5B9E" />
      <stop offset="88%" stop-color="#7CC8EC" />
      <stop offset="100%" stop-color="#D6F1FC" />
    </linearGradient>
    <linearGradient id="harborWater" x1="500" y1="790" x2="500" y2="1200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#132D59" />
      <stop offset="45%" stop-color="#0D2040" />
      <stop offset="100%" stop-color="#081326" />
    </linearGradient>
    <linearGradient id="sunBeam" x1="500" y1="340" x2="500" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0F9FF" stop-opacity="0.22" />
