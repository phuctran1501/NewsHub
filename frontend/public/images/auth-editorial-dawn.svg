    <rect x="172" y="598" width="14" height="6" rx="2" />
    <rect x="196" y="598" width="14" height="6" rx="2" />
    <rect x="148" y="618" width="14" height="6" rx="2" />
    <rect x="196" y="618" width="14" height="6" rx="2" />
    <rect x="148" y="638" width="14" height="6" rx="2" />
    <rect x="172" y="638" width="14" height="6" rx="2" />

    <rect x="728" y="582" width="16" height="6" rx="2" />
    <rect x="756" y="582" width="16" height="6" rx="2" />
    <rect x="784" y="582" width="16" height="6" rx="2" />
    <rect x="728" y="604" width="16" height="6" rx="2" />
    <rect x="784" y="604" width="16" height="6" rx="2" />
    <rect x="756" y="626" width="16" height="6" rx="2" />
    <rect x="784" y="626" width="16" height="6" rx="2" />
