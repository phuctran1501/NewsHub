    <rect x="152" y="486" width="92" height="314" />
    <polygon points="152,486 198,442 244,486" />
    <rect x="278" y="522" width="84" height="278" />
    <rect x="658" y="472" width="98" height="328" />
    <rect x="682" y="438" width="50" height="34" />
    <rect x="780" y="534" width="88" height="266" />
    <rect x="886" y="502" width="74" height="298" />
  </g>

