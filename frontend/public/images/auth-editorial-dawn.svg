  <circle cx="560" cy="540" r="390" stroke="#A6E1FA" stroke-opacity="0.16" stroke-width="1.2" />
  <circle cx="560" cy="540" r="290" stroke="#D6F1FC" stroke-opacity="0.22" stroke-width="1.2" stroke-dasharray="5 7" />

  <!-- Rising Morning Sun Disc & Crisp Atmospheric Halo -->
  <circle cx="560" cy="535" r="148" fill="#E0F4FE" fill-opacity="0.22" />
  <circle cx="560" cy="535" r="106" fill="#F0F9FF" />
  <polygon points="560,390 290,800 830,800" fill="url(#sunBeam)" />

  <!-- Soft High-Altitude Clouds (Flat 2D Minimalist) -->
  <path d="M110 270H290C301 270 310 261 310 250C310 239 301 230 290 230H254C246 212 228 200 206 200C181 200 160 217 155 240H110C99 240 90 249 90 260C90 266 95 270 110 270Z" fill="#A6E1FA" fill-opacity="0.14" />
  <path d="M700 210H880C890 210 898 202 898 192C898 182 890 174 880 174H835C827 156 809 144 788 144C765 144 746 159 740 180H700C690 180 682 188 682 198C682 205 688 210 700 210Z" fill="#D6F1FC" fill-opacity="0.16" />

  <!-- Distant Mountain / Peninsula Silhouette -->
  <path d="M0 742L190 676L375 718L590 658L815 706L1000 664V800H0V742Z" fill="#234B86" />

