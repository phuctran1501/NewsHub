    <rect x="496" y="836" width="128" height="3.5" rx="1.75" fill-opacity="0.55" />
    <rect x="518" y="854" width="84" height="3" rx="1.5" fill-opacity="0.42" />
    <rect x="464" y="874" width="192" height="2.5" rx="1.25" fill-opacity="0.28" />
