name: NewsHub CI/CD Quality Gate

# Kích hoạt pipeline khi push hoặc tạo Pull Request vào nhánh main hoặc develop
on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

# Hủy các pipeline cũ đang chạy dang dở trên PR (giữ nguyên các lượt chạy trên main/develop)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  # ==============================================================================
  # Job 1: Kiểm định Chất lượng & Kiểm thử Backend (.NET 10 C# 14)
  # ==============================================================================
  build-and-test-backend:
    name: Build & Test Backend (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.400"
          cache: true
          cache-dependency-path: "backend/**/packages.lock.json"

      - name: Restore Dependencies (Locked Mode)
        working-directory: ./backend
        run: dotnet restore NewsHub.slnx

      - name: Build Solution (Release Mode)
        working-directory: ./backend
        run: dotnet build NewsHub.slnx --configuration Release --no-restore

      - name: Run Test Suite (527 Unit & Integration Tests)
        working-directory: ./backend
        run: dotnet test NewsHub.slnx --configuration Release --no-build --verbosity normal

  # ==============================================================================
  # Job 2: Kiểm định Chất lượng Cú pháp & Đóng gói Frontend (React 19 & Vite)
  # ==============================================================================
  build-and-lint-frontend:
    name: Lint & Build Frontend (React 19 & Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint Code Quality (ESLint)
        working-directory: ./frontend
        run: npm run lint

      - name: Build Production Bundle (TypeScript & Vite)
        working-directory: ./frontend
        run: npm run build

  # ==============================================================================
  # Job 3: Kiểm định Tính Toàn Vẹn Của Dockerfile Multi-Stage Build
  # ==============================================================================
  docker-build-check:
    name: Dockerfile Multi-Stage Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Backend Docker Build (Dry-Run)
        run: docker build -f backend/Dockerfile ./backend -t newshub-api-staging:test

  # ==============================================================================
  # Job 4: Quét Lỗ Hổng Bảo Mật Toàn Bộ Dự Án (Snyk SCA Security Scan)
  # ==============================================================================
  security-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    needs: [build-and-test-backend, build-and-lint-frontend]
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Snyk Security Scan (Fail on HIGH/CRITICAL)
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@12140f4059e244892ae643824a95459a102120dd
        with:
          args: --all-projects --severity-threshold=high

      - name: Notice When SNYK_TOKEN Is Not Configured
        if: env.SNYK_TOKEN == ''
        run: echo "::warning ::SNYK_TOKEN secret is not set. Security scan was skipped."
